<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nota 1</title>
</head>
    <link rel="stylesheet" href="style.css">
<body>

    <h1>note 1</h1>
    <h4>Seu texto será salvo automaticamente em seu navegador, favor não deletar cookies!</h4>
        <div class="container">
    <textarea id="nota" rows="38" cols="110" placeholder="Digite aqui"></textarea>
</div>

    <button><a href="home.html"> Voltar </a> </button>

    <script>
        const campo = document.getElementById('nota');

        campo.value = localStorage.getItem('textoSalvo') || '';

        campo.addEventListener('input', () => {
            localStorage.setItem('textoSalvo', campo.value);
        });

    </script>

</body>
</html>
